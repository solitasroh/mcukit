name: SBOM

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/gen-sbom.mjs'
      - '.github/workflows/sbom.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 0 * * 1'  # weekly Monday 00:00 UTC
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `cache: npm` — rkit is a plugin with zero npm dependencies
          # (deps: [] / devDeps: []), so there's no lockfile to cache.
      - name: Generate SBOM
        env:
          CI: 'true'
        # gen-sbom.mjs uses fallback minimal SBOM when cyclonedx-npm is
        # unavailable (logged as rkit:sbom:degraded=true property).
        # continue-on-error: true tolerates the fallback path; upload step
        # still publishes the resulting bom.json.
        run: npm run sbom
        continue-on-error: true
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/bom.json
          retention-days: 90

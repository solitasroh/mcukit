name: code-review
classification: workflow
version: 1.6.2
judge: regex_only
description: "code-review process compliance + Cycle 1.5 adaptive gating + cross-review dedup"

evals:
  - name: trigger-accuracy
    prompt: prompt-1.md
    expected: expected-1.md
    criteria:
      - "Must trigger correctly on relevant keywords"
      - "Must follow defined process steps"
    timeout: 60000
  - name: cycle15-before
    prompt: cycle15-before.prompt.md
    expected: cycle15-before.expected.md
    assertions:
      - type: regex_negative
        patterns:
          - "자동 생략됨"
          - "fingerprint"
          - "100 entries 윈도우"
  - name: cycle15-after
    prompt: cycle15-after.prompt.md
    expected: cycle15-after.expected.md
    assertions:
      - type: regex_positive
        patterns:
          - "자동 생략됨"
          - "이전 리뷰에서 사용자가 무시한"
          - "NEVER_GATE"

parity_test:
  enabled: false

benchmark:
  model_baseline: "claude-sonnet-4-6"
  metrics:
    - trigger_accuracy
    - process_compliance
